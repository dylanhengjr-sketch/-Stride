name: Stride
options:
  bundleIdPrefix: com.stride.tracker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"

targets:
  Stride:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Stride
        excludes:
          - "**/*.plist"
          - "**/Assets.xcassets/**"
      - path: Stride/Resources/Assets.xcassets
        buildPhase: resources
    configFiles:
      Debug: Config/Stride.xcconfig
      Release: Config/Stride.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stride.tracker.app
        PRODUCT_NAME: Stride
        INFOPLIST_FILE: Stride/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"

  StrideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StrideTests
    dependencies:
      - target: Stride
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stride.tracker.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stride.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Stride"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Stride:
    build:
      targets:
        Stride: all
        StrideTests: [test]
    run:
      config: Debug
      commandLineArguments: {}
    test:
      config: Debug
      targets:
        - StrideTests
    archive:
      config: Release
