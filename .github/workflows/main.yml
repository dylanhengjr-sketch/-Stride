
name: Stride iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Stride
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: List available simulators
        run: |
          xcrun simctl list devices available

      - name: Run automated tests
        continue-on-error: true
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m 1 -E 'iPhone.*\([A-F0-9-]{36}\)' | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi
          echo "Using simulator: $DEVICE_ID"
          xcodebuild test \
            -project Stride.xcodeproj \
            -scheme Stride \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stride-Test-Results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Build for physical iPhone
        run: |
          xcodebuild build \
            -project Stride.xcodeproj \
            -scheme Stride \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Stride.app Payload/
          zip -r Stride-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stride-unsigned-IPA
          path: Stride-unsigned.ipa
          retention-days: 7
